{% extends "base.html" %}

{% block content %}

<section class="characters">

    <div class="section-title">
        <h2>✏ แก้ไขตัวละคร</h2>
        <p>แก้ไขข้อมูลของตัวละครในอาณาจักร</p>
    </div>

    <form
        action="/update-character/{{ character['id'] }}"
        method="post"
        enctype="multipart/form-data"
        class="admin-form">
        <label>👑 ชื่อตัวละคร</label>
        <input
            type="text"
            name="name"
            value="{{ character['name'] }}"
            required>
        <label>🎖 ตำแหน่ง</label>
        <input
            type="text"
            name="title"
            value="{{ character['title'] }}">
        <label>🐾 เผ่าพันธุ์</label>
        <input
            type="text"
            name="race"
            value="{{ character['race'] }}">
        <label>🎂 อายุ</label>
        <input
            type="number"
            name="age"
            value="{{ character['age'] }}">
        <label>🏠 บ้าน</label>
        <input
            type="text"
            name="home"
            value="{{ character['home'] }}">
        <label>❤️ ความสัมพันธ์</label>
        <input
            type="text"
            name="relationship"
            value="{{ character['relationship'] }}">
        <label>📖 ประวัติ</label>
        <textarea
            name="description"
            rows="5">{{ character["description"] }}</textarea>

        <!---
            <input
            type="file"
            name="image"
            accept="image/*">
        -->

        <button type="submit">
            💾 บันทึกการแก้ไข
        </button>

    </form>

</section>

{% endblock %}
